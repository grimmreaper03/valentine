<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Will you be my Valentine, Bubu? ❤️</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;}
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .card {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 2;
      min-width: 280px;
    }

    h1 { margin-bottom: 1.6rem; color:#333; font-size:1.25rem; }

    button {
      font-size: 1.05rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      margin-right: 1rem;
    }

    #no {
      background: #e0e0e0;
      color: #333;
      position: fixed;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: explode 1.5s ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes explode {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--x), var(--y)) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine, Bubu? 💖</h1>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yesButton = document.getElementById("yes");
      const noButton = document.getElementById("no");
      if (!yesButton || !noButton) return;

      function explodeHearts(x, y) {
        for (let i = 0; i < 25; i++) {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.textContent = "❤️";
          const angle = Math.random() * 2 * Math.PI;
          const distance = 50 + Math.random() * 100;
          heart.style.left = `${x}px`;
          heart.style.top = `${y}px`;
          heart.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          heart.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        }
      }

      yesButton.addEventListener("click", (e) => {
        const rect = e.target.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        explodeHearts(x, y);
        setTimeout(() => alert("You made the right choice, Alisha ❤️"), 300);
      });

      noButton.addEventListener("mouseenter", () => {
        const padding = 20;
        const maxX = window.innerWidth - noButton.offsetWidth - padding;
        const maxY = window.innerHeight - noButton.offsetHeight - padding;
        noButton.style.left = Math.floor(Math.random() * maxX) + "px";
        noButton.style.top = Math.floor(Math.random() * maxY) + "px";
      });
    });
  </script>
</body>
</html>
