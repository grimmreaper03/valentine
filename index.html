<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Will you be my Valentine, Bubu? ❤️</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;}
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .card {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 2;
      min-width: 280px;
    }

    h1 { margin-bottom: 1.6rem; color:#333; font-size:1.25rem; }

    button {
      font-size: 1.05rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      margin-right: 1rem;
    }

    #no {
      background: #e0e0e0;
      color: #333;
      position: fixed;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: explode 1.5s ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes explode {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--x), var(--y)) scale(0.5);
        opacity: 0;
      }
    }

    /* Confetti canvas (full page) */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
    }

    /* Big overlay text */
    .love-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      pointer-events: none;
      text-align: center;
      animation: overlay-in 700ms ease-out forwards;
    }

    .love-overlay .text {
      color: white;
      font-weight: 800;
      font-size: 8vw;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.35),
        0 0 40px rgba(255,255,255,0.08);
      transform: scale(0.85);
      opacity: 0;
      animation: text-pop 900ms ease-out forwards;
      padding: 0 1rem;
    }

    @keyframes overlay-in {
      from { backdrop-filter: blur(0px); }
      to { backdrop-filter: blur(2px); }
    }

    @keyframes text-pop {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Make sure small screens have readable text */
    @media (max-width: 600px) {
      .love-overlay .text {
        font-size: 14vw;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine, Bubu? 💖</h1>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yesButton = document.getElementById("yes");
      const noButton = document.getElementById("no");
      if (!yesButton || !noButton) return;

      function explodeHearts(x, y) {
        for (let i = 0; i < 25; i++) {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.textContent = "❤️";
          const angle = Math.random() * 2 * Math.PI;
          const distance = 50 + Math.random() * 100;
          heart.style.left = `${x}px`;
          heart.style.top = `${y}px`;
          heart.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          heart.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        }
      }

      // Lightweight canvas confetti
      function startConfetti({duration = 5000, particleCount = 150} = {}) {
        // avoid creating multiple canvases
        if (document.getElementById('confetti-canvas')) return;

        const canvas = document.createElement('canvas');
        canvas.id = 'confetti-canvas';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        const colors = [
          '#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93',
          '#ff7eb3', '#ffd6e0', '#ffb4a2'
        ];

        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -canvas.height,
            w: 6 + Math.random() * 8,
            h: 8 + Math.random() * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI * 2,
            velX: (Math.random() - 0.5) * 2,
            velY: 2 + Math.random() * 5,
            rotSpeed: (Math.random() - 0.5) * 0.2,
            opacity: 0.9
          });
        }

        let start = performance.now();
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function draw(now) {
          const elapsed = now - start;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.x += p.velX;
            p.y += p.velY;
            p.rot += p.rotSpeed;
            // simple air resistance and gravity-ish effect
            p.velY += 0.02;

            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            // draw rectangle confetti
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
          });

          // keep animating while within duration or until all particles off-screen slightly after
          if (elapsed < duration || particles.some(p => p.y < canvas.height + 100)) {
            requestAnimationFrame(draw);
          } else {
            // cleanup
            window.removeEventListener('resize', resizeCanvas);
            canvas.remove();
          }
        }

        requestAnimationFrame(draw);
      }

      function showLoveOverlay({text = "I love you baby", timeout = 5000} = {}) {
        if (document.querySelector('.love-overlay')) return;
        const overlay = document.createElement('div');
        overlay.className = 'love-overlay';
        overlay.innerHTML = `<div class="text">${text}</div>`;
        document.body.appendChild(overlay);

        // remove overlay after timeout with a gentle fade
        setTimeout(() => {
          overlay.style.transition = 'opacity 500ms ease-out, transform 500ms ease-out';
          overlay.style.opacity = '0';
          overlay.style.transform = 'scale(0.98)';
          setTimeout(() => overlay.remove(), 600);
        }, timeout);
      }

      yesButton.addEventListener("click", (e) => {
        const rect = e.target.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        explodeHearts(x, y);
        // start full-page confetti and show big message
        startConfetti({duration: 6000, particleCount: 200});
        showLoveOverlay({text: "I love you baby", timeout: 6000});
        // removed the alert popup so the experience stays in-page and clean
      });

      noButton.addEventListener("mouseenter", () => {
        const padding = 20;
        const maxX = window.innerWidth - noButton.offsetWidth - padding;
        const maxY = window.innerHeight - noButton.offsetHeight - padding;
        noButton.style.left = Math.floor(Math.random() * maxX) + "px";
        noButton.style.top = Math.floor(Math.random() * maxY) + "px";
      });
    });
  </script>
</body>
</html>
